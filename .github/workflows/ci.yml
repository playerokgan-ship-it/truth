name: NewCI
on: [push]
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-python@v4
          with:
            python-version: "3.10"
        - run: pip install -r requirements.txt
        - run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
        - run: pytest
        - run: flake8 app tests

